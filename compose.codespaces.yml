# Development/testing override. Only the web port may be made public.
services:
  api:
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?Run infrastructure/codespaces/start.sh}
      COOKIE_SECURE: "true"
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx1024m
      S3_ACCESS_KEY: S3RVER
      S3_SECRET_KEY: S3RVER
    restart: unless-stopped
  minio:
    build:
      context: .
      dockerfile: infrastructure/codespaces/storage.Dockerfile
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9000').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  media-init:
    environment:
      S3_ACCESS_KEY: S3RVER
      S3_SECRET_KEY: S3RVER
  media-worker:
    environment:
      S3_ACCESS_KEY: S3RVER
      S3_SECRET_KEY: S3RVER
  ai-service:
    build:
      context: .
      dockerfile: infrastructure/codespaces/ai.Dockerfile
    restart: unless-stopped
  kafka:
    environment:
      KAFKA_HEAP_OPTS: -Xms128m -Xmx512m
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 16777216
    restart: unless-stopped
  web:
    restart: unless-stopped
