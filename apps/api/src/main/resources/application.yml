spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        max.block.ms: 5000
    consumer:
      group-id: vybe-analytics-v1
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
  servlet:
    multipart:
      max-file-size: 250MB
      max-request-size: 251MB
  application:
    name: vybe-api
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_TLS:false}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vybe}
    username: ${DATABASE_USER:vybe}
    password: ${DATABASE_PASSWORD:vybe_local}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  session:
    jdbc:
      initialize-schema: never
    timeout: 7d
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_TLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        name: VYBE_SESSION
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax
  error:
    include-message: never
management:
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACE_SAMPLE_RATE:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db,redis
      probes:
        enabled: true
      show-details: never
  health:
    mail:
      enabled: false
logging:
  structured:
    format:
      console: logstash
vybe:
  kafka-enabled: ${KAFKA_ENABLED:false}
  metrics-token: ${METRICS_TOKEN:}
  ai-url: ${AI_SERVICE_URL:http://127.0.0.1:8001}
  ai-key: ${AI_INTERNAL_KEY:}
  public-url: ${PUBLIC_URL:http://localhost:3000}
  mail-from: ${MAIL_FROM:hello@vybe.local}
  mail-enabled: ${MAIL_ENABLED:true}

storage:
  endpoint: ${S3_ENDPOINT:http://127.0.0.1:9000}
  access-key: ${S3_ACCESS_KEY:S3RVER}
  secret-key: ${S3_SECRET_KEY:S3RVER}
  bucket: ${S3_BUCKET:vybe-media}
  region: ${S3_REGION:us-east-1}
